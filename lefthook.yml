commit-msg:
  piped: true
  commands:
    attribution:
      priority: 1
      run: bun scripts/check-commit-msg.ts "{1}"
    conventional:
      priority: 2
      run: bunx --no-install commitlint --edit "{1}"

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test

pre-commit:
  piped: true
  commands:
    format:
      priority: 1
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,yaml,yml,toml}"
      run: bunx --no-install oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: bunx --no-install oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true
